    }

    document.getElementById('startBtn').addEventListener('click', () => {
      document.getElementById('gate').classList.add('hide');
      initSC();
      setTimeout(() => { if (widget) widget.play(); }, 400);
    });

    document.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.dock') || e.target.closest('.gate') || e.target.closest('button') || e.target.closest('iframe')) return;
      const x = e.clientX, y = e.clientY;
      const ring = document.createElement('div');
      ring.className = 'ring';
      ring.style.left = x + 'px'; ring.style.top = y + 'px';
      fx.appendChild(ring);
      setTimeout(() => ring.remove(), 500);
      for (let i = 0; i < 8; i++) {
        const s = document.createElement('div');
        s.className = 'spark';
        const a = (Math.PI * 2 * i) / 8 + Math.random() * 0.2;
        const d = 30 + Math.random() * 50;
        s.style.setProperty('--dx', Math.cos(a) * d + 'px');
        s.style.setProperty('--dy', Math.sin(a) * d + 'px');
        s.style.left = x + 'px'; s.style.top = y + 'px';
        s.style.background = i % 2 ? 'var(--pink)' : 'var(--cyan)';
        s.style.boxShadow = '0 0 8px ' + s.style.background;
        fx.appendChild(s);
        setTimeout(() => s.remove(), 600);
      }
    });

    function resize() {
      const p = canvas.parentElement;
      if (!p) return;
      const r = p.getBoundingClientRect();
      const dpr = Math.min(devicePixelRatio || 1, 2);
      canvas.width = r.width * dpr; canvas.height = r.height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener('resize', resize);
    setTimeout(resize, 60);

    function draw() {
      if (!playing) return;
      raf = requestAnimationFrame(draw);
      phase += 0.07;
      const dpr = Math.min(devicePixelRatio || 1, 2);
      const w = canvas.width / dpr, h = canvas.height / dpr;
      ctx.clearRect(0, 0, w, h);
      const g = ctx.createRadialGradient(w/2, h/2, 0, w/2, h/2, w * 0.5);
      g.addColorStop(0, 'rgba(139,92,246,0.12)');
      g.addColorStop(0.6, 'rgba(255,45,155,0.04)');
      g.addColorStop(1, 'transparent');
      ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
      const n = 36, bw = w / n;
      for (let i = 0; i < n; i++) {
        const v1 = Math.sin(phase + i * 0.3) * 0.5 + 0.5;
        const v2 = Math.sin(phase * 1.3 + i * 0.18) * 0.3 + 0.45;
        const v = v1 * v2;
        const bh = v * h * 0.58;
        const hue = 300 + (i / n) * 50;
        ctx.shadowBlur = 8;
        ctx.shadowColor = 'hsla(' + hue + ',90%,55%,0.7)';
        ctx.fillStyle = 'hsla(' + hue + ',90%,52%,' + (0.25 + v * 0.65) + ')';
        ctx.fillRect(i * bw + 1.5, h - bh, bw - 3, bh);
      }
      const pulse = Math.sin(phase * 2) * 0.5 + 0.5;
      ctx.beginPath();
      ctx.arc(w/2, h/2, 12 + pulse * 24, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255,45,155,' + (0.15 + pulse * 0.4) + ')';
      ctx.lineWidth = 1.5 + pulse * 2.5;
      ctx.shadowBlur = 14; ctx.shadowColor = '#ff2d9b';
      ctx.stroke();
    }
  </script>
</body>
</html>
